<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Explaining Markets · AI-agenten{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="em-shell">
    <aside class="em-sidebar">
      <h1>Explaining Markets</h1>
      <p class="caption">AI-agent for earnings-reaksjoner · Q4 2026</p>
      <nav class="em-nav" aria-label="Hovednavigasjon">
        {% for href, label in nav %}
        <a href="{{ href }}" class="{% if label == active %}active{% endif %}{% if label == 'Forskning' and not is_admin %} em-nav-locked{% endif %}">
          {{ label }}{% if label == "Forskning" and not is_admin %}<span class="em-lock" aria-hidden="true"></span>{% endif %}
        </a>
        {% endfor %}
      </nav>
      {% if is_admin %}
      <form method="post" action="/admin/logout" class="em-logout-form">
        <button type="submit" class="em-logout">Logg ut</button>
      </form>
      {% endif %}
      <hr class="em-sidebar-divider">
      <div class="em-live-status">
        <div class="ok em-live-dot">Live · deployet på Modal</div>
      </div>
      <hr class="em-sidebar-divider">
      <p class="caption">
        <a href="{{ competition_url }}">explainingmarkets.ai</a> ·
        <a href="{{ repo_url }}">Repo</a>
      </p>
    </aside>
    <main class="em-main">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
