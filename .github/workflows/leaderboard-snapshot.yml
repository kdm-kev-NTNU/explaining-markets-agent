name: Leaderboard snapshot

# Logger egen plassering på explainingmarkets.ai til data/leaderboard_history.csv.
# Arrangøren oppdaterer standings omtrent én gang i døgnet.
on:
  schedule:
    - cron: "17 6 * * *" # daglig 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: leaderboard-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hent plassering
        run: python scripts/snapshot_leaderboard.py

      - name: Commit hvis noe er nytt
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "Ingen endring."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/leaderboard_history.csv
          git commit -m "chore: leaderboard snapshot $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
